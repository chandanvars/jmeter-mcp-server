# JMeter Docker Compose Configuration
# Generated by JMeter MCP Server

version: '3.8'

services:
  jmeter-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jmeter-Basic_UI_Login_Test
    volumes:
      - ./output:/tests:ro
      - ./sample_data:/data:ro
      - ./jmeter-results:/results
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2'
    environment:
      - JMX_FILE=Basic_UI_Login_Test.jmx
      - TEST_NAME=Basic_UI_Login_Test
    networks:
      - jmeter-network
    command: ["Basic_UI_Login_Test.jmx"]

  # Optional: Resource monitoring
  monitoring:
    image: prom/node-exporter:latest
    container_name: jmeter-monitoring
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - jmeter-network
    profiles:
      - monitoring

networks:
  jmeter-network:
    driver: bridge

volumes:
  jmeter-results:
    driver: local
